name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test deps (jsdom)
        run: npm ci

      - name: Run smoke suite
        run: npm test

      - name: Syntax check app scripts
        run: |
          node --check js/data.js
          node --check js/store.js
          node --check js/app.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Version consistency (data.js ⇄ sw.js ⇄ package.json)
        run: |
          APP_V=$(grep -m1 -o 'version: "[0-9.]*"' js/data.js | grep -o '[0-9.]*')
          SW_V=$(grep -m1 -o 'pathfinder-v[0-9.]*' sw.js | grep -o '[0-9.]*')
          PKG_V=$(node -p "require('./package.json').version")
          echo "app=$APP_V sw=$SW_V pkg=$PKG_V"
          test "$APP_V" = "$SW_V" || { echo "::error::js/data.js 与 sw.js 版本不一致"; exit 1; }
          test "$APP_V" = "$PKG_V" || { echo "::error::js/data.js 与 package.json 版本不一致"; exit 1; }
