name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动开启本仓库的 GitHub Pages（来源：GitHub Actions）
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # 纯静态站点，仓库根目录即为站点根目录
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
